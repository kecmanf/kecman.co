<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Arial, sans-serif">
  <style>
    .box { fill: #fff; stroke: #1a2b4c; stroke-width: 2; rx: 8; }
    .box-bad { fill: #fff5f5; stroke: #b02a2a; stroke-width: 2; rx: 8; }
    .box-good { fill: #f2fbf5; stroke: #1f7a3d; stroke-width: 2; rx: 8; }
    .label { font-size: 15px; font-weight: 700; fill: #1a2b4c; }
    .small { font-size: 12px; fill: #333; }
    .mono { font-family: "Courier New", monospace; font-size: 11px; fill: #333; }
    .arrow { stroke: #1a2b4c; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .arrow-bad { stroke: #b02a2a; stroke-width: 2; marker-end: url(#arrowbad); fill: none; }
    .arrow-good { stroke: #1f7a3d; stroke-width: 2; marker-end: url(#arrowgood); fill: none; }
    .section-title { font-size: 17px; font-weight: 800; fill: #1a2b4c; }
    .badge-bad { fill: #b02a2a; font-size: 12px; font-weight: 700; }
    .badge-good { fill: #1f7a3d; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrowbad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b02a2a"/>
    </marker>
    <marker id="arrowgood" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f7a3d"/>
    </marker>
  </defs>

  <rect width="1000" height="500" fill="#f7f8fa"/>

  <!-- BEFORE -->
  <text x="30" y="35" class="section-title">Before: Burp default</text>

  <rect x="30" y="60" width="180" height="60" class="box"/>
  <text x="120" y="85" text-anchor="middle" class="label">Browser</text>
  <text x="120" y="103" text-anchor="middle" class="small">Firefox</text>

  <rect x="400" y="60" width="200" height="60" class="box"/>
  <text x="500" y="85" text-anchor="middle" class="label">Burp Suite</text>
  <text x="500" y="103" text-anchor="middle" class="small">MITM proxy</text>

  <rect x="790" y="60" width="180" height="60" class="box-bad"/>
  <text x="880" y="85" text-anchor="middle" class="label">Target web app</text>
  <text x="880" y="103" text-anchor="middle" class="small">+ anti-bot layer</text>

  <path d="M210,90 H400" class="arrow"/>
  <text x="305" y="80" text-anchor="middle" class="small">TLS #1: real Firefox ClientHello</text>

  <path d="M600,90 H790" class="arrow-bad"/>
  <text x="695" y="80" text-anchor="middle" class="small">TLS #2: Burp's OWN ClientHello</text>

  <rect x="400" y="150" width="390" height="70" class="box-bad"/>
  <text x="595" y="172" text-anchor="middle" class="mono" font-weight="700">JA3: Java/Burp TLS stack</text>
  <text x="595" y="190" text-anchor="middle" class="badge-bad">MISMATCH: flagged as bot</text>
  <text x="595" y="208" text-anchor="middle" class="small">Invisible risk challenge fails</text>

  <!-- AFTER -->
  <text x="30" y="280" class="section-title">After: Burp + Bypass Bot Detection extension</text>

  <rect x="30" y="305" width="180" height="60" class="box"/>
  <text x="120" y="330" text-anchor="middle" class="label">Browser</text>
  <text x="120" y="348" text-anchor="middle" class="small">Firefox</text>

  <rect x="400" y="305" width="200" height="60" class="box"/>
  <text x="500" y="330" text-anchor="middle" class="label">Burp Suite</text>
  <text x="500" y="348" text-anchor="middle" class="small">+ bypass extension</text>

  <rect x="790" y="305" width="180" height="60" class="box-good"/>
  <text x="880" y="330" text-anchor="middle" class="label">Target web app</text>
  <text x="880" y="348" text-anchor="middle" class="small">+ anti-bot layer</text>

  <path d="M210,335 H400" class="arrow"/>
  <text x="305" y="325" text-anchor="middle" class="small">TLS #1: real Firefox ClientHello</text>

  <path d="M600,335 H790" class="arrow-good"/>
  <text x="695" y="325" text-anchor="middle" class="small">TLS #2: spoofed Firefox ClientHello</text>

  <rect x="400" y="395" width="390" height="70" class="box-good"/>
  <text x="595" y="417" text-anchor="middle" class="mono" font-weight="700">JA3: mimics real Firefox</text>
  <text x="595" y="435" text-anchor="middle" class="badge-good">MATCH: looks like a real browser</text>
  <text x="595" y="453" text-anchor="middle" class="small">Invisible risk challenge passes</text>
</svg>
