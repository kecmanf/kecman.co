<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Arial, sans-serif">
  <style>
    .box { fill: #fff; stroke: #1a2b4c; stroke-width: 2; rx: 8; }
    .box-bad { fill: #fff5f5; stroke: #b02a2a; stroke-width: 2; rx: 8; }
    .label { font-size: 15px; font-weight: 700; fill: #1a2b4c; }
    .small { font-size: 12px; fill: #333; }
    .mono { font-family: "Courier New", monospace; font-size: 11px; fill: #333; }
    .arrow { stroke: #1a2b4c; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .arrow-bad { stroke: #b02a2a; stroke-width: 2; marker-end: url(#arrowbad); fill: none; }
    .badge-bad { fill: #b02a2a; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a2b4c"/>
    </marker>
    <marker id="arrowbad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b02a2a"/>
    </marker>
  </defs>

  <rect width="1000" height="260" fill="#f7f8fa"/>

  <rect x="30" y="20" width="180" height="60" class="box"/>
  <text x="120" y="45" text-anchor="middle" class="label">Browser</text>
  <text x="120" y="63" text-anchor="middle" class="small">Firefox</text>

  <rect x="400" y="20" width="200" height="60" class="box"/>
  <text x="500" y="45" text-anchor="middle" class="label">Burp Suite</text>
  <text x="500" y="63" text-anchor="middle" class="small">MITM proxy</text>

  <rect x="790" y="20" width="180" height="60" class="box-bad"/>
  <text x="880" y="45" text-anchor="middle" class="label">Target web app</text>
  <text x="880" y="63" text-anchor="middle" class="small">+ anti-bot layer</text>

  <path d="M210,50 H400" class="arrow"/>
  <text x="305" y="40" text-anchor="middle" class="small">TLS #1: real Firefox ClientHello</text>

  <path d="M600,50 H790" class="arrow-bad"/>
  <text x="695" y="40" text-anchor="middle" class="small">TLS #2: Burp's OWN ClientHello</text>

  <rect x="400" y="110" width="390" height="120" class="box-bad"/>
  <text x="595" y="132" text-anchor="middle" class="mono" font-weight="700">JA3 fingerprint: Java/Burp TLS stack</text>
  <text x="595" y="150" text-anchor="middle" class="mono">HTTP header: User-Agent: Firefox</text>
  <text x="595" y="172" text-anchor="middle" class="badge-bad">MISMATCH: flagged as bot</text>
  <text x="595" y="196" text-anchor="middle" class="small">Invisible risk challenge fails.</text>
  <text x="595" y="214" text-anchor="middle" class="small">Session gets silently downgraded or rejected.</text>
</svg>
